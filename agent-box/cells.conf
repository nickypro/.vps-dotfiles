# Isolated agents on this box: copied to /opt/agent-box/cells.conf in the
# image (see cells/lib.sh), so change it and make rebuild.
#
# Your folders. A cell can read anything world-readable, so these lose their
# "other" permissions when the first cell is made (and at every start).
CELL_PRIVATE_DIRS="/home/dev /data"
# Shared scratch space cells may create files in but not list.
CELL_DENY_DIRS="/tmp /var/tmp"
