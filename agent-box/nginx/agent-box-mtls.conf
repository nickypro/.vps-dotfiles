# T3 Code web UI for the agent-box container, ACCESS=mtls (config.mk).
# Two independent locks: a client certificate from your private CA, OR a
# password -- plus T3's own pairing tokens behind both. Wrong passwords are
# banned by fail2ban/nginx-http-auth.local.
#
# Replace code.example.com with your domain and get a cert first, e.g.
#   certbot certonly --nginx -d code.example.com
# `sudo make host-config` links this file into sites-enabled.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# A verified client cert switches basic-auth off ("off" is nginx's literal
# value for "no auth_basic"). Anything else falls back to a password prompt.
map $ssl_client_verify $agent_box_auth {
    SUCCESS off;
    default "agent-box";
}

server {
    listen 80;
    listen [::]:80;
    server_name code.example.com;
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name code.example.com;

    ssl_certificate     /etc/letsencrypt/live/code.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/code.example.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Offer client-cert auth but do not require it, so a device without a
    # cert still reaches the password prompt instead of being refused.
    # Use `on` instead to make the cert mandatory (no password fallback).
    ssl_client_certificate /etc/nginx/agent-box/ca.crt;
    ssl_verify_client      optional;

    auth_basic           $agent_box_auth;
    auth_basic_user_file /etc/nginx/agent-box/htpasswd;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options SAMEORIGIN always;
    client_max_body_size 512m;

    location / {
        proxy_pass http://127.0.0.1:3773;
        proxy_http_version 1.1;

        # T3 drives everything over a WebSocket; without these it connects
        # and then hangs with an empty UI.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Agent turns can be long; don't cut them off mid-stream.
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering     off;
    }
}
