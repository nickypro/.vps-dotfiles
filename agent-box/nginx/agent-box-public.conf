# T3 Code web UI for the agent-box container, ACCESS=public (config.mk).
# One lock: a password (plus T3's own pairing tokens behind it). T3's UI is
# effectively a terminal with sudo in the container, so that password is
# backed up by three things:
#   - it is generated, never chosen (`make web-passwd`),
#   - requests are rate limited per IP (below),
#   - fail2ban bans an IP after repeated wrong passwords
#     (fail2ban/nginx-http-auth.local).
#
# Replace code.example.com with your domain and get a cert first, e.g.
#   certbot certonly --nginx -d code.example.com
# `sudo make host-config` links this file into sites-enabled.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Per-IP request budget. Every password guess is a request, so this caps
# guessing at a few per second even before fail2ban notices. The burst is
# generous because opening the UI fetches dozens of files at once.
limit_req_zone $binary_remote_addr zone=agent_box:10m rate=5r/s;

server {
    listen 80;
    listen [::]:80;
    server_name code.example.com;
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name code.example.com;

    ssl_certificate     /etc/letsencrypt/live/code.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/code.example.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Mandatory: there is no other lock in this mode. If the file is missing,
    # nginx refuses every request rather than letting anyone in.
    auth_basic           "agent-box";
    auth_basic_user_file /etc/nginx/agent-box/htpasswd;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options SAMEORIGIN always;
    client_max_body_size 512m;

    location / {
        # Runs before the password check, so wrong guesses count too.
        limit_req        zone=agent_box burst=60 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:3773;
        proxy_http_version 1.1;

        # T3 drives everything over a WebSocket; without these it connects
        # and then hangs with an empty UI.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Agent turns can be long; don't cut them off mid-stream.
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering     off;
    }
}
